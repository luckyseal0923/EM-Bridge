<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMS Bridge｜EMS-醫院個案銜接平台</title>
  <style>
    :root{
      --primary:#0284c7; --primary-dark:#0369a1; --primary-soft:#e0f2fe;
      --ems:#2563eb; --hospital:#059669;
      --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#64748b;
      --border:#e2e8f0; --shadow:0 10px 30px rgba(15,23,42,.06);
      --pending-bg:#fff7ed;--pending-text:#c2410c;--pending-border:#fed7aa;
      --progress-bg:#eff6ff;--progress-text:#1d4ed8;--progress-border:#bfdbfe;
      --done-bg:#ecfdf5;--done-text:#047857;--done-border:#a7f3d0;
      --closed-bg:#f1f5f9;--closed-text:#475569;--closed-border:#cbd5e1;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body{ margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif; }
    .container{ max-width:1400px; margin:0 auto; padding:24px; }

    /* ===== Login Overlay ===== */
    #loginOverlay{
      position:fixed; inset:0; background:linear-gradient(135deg,#e0f2fe,#bae6fd);
      display:flex; align-items:center; justify-content:center; z-index:100;
    }
    .login-card{
      background:#fff; border-radius:24px; padding:36px 36px 40px; width:380px;
      box-shadow:0 30px 80px rgba(0,0,0,0.3);
    }
    .login-card label{ display:block; font-size:13px; font-weight:600; color:#334155; margin-bottom:6px; }
    .login-card input{
      width:100%; border:1px solid #e2e8f0; border-radius:12px; padding:11px 12px;
      font-size:14px; outline:none; margin-bottom:12px; box-sizing:border-box;
    }
    .login-card input:focus{ border-color:#7dd3fc; box-shadow:0 0 0 4px rgba(2,132,199,.15); }
    .login-btn{
      width:100%; background:var(--primary); color:#fff; border:none; border-radius:12px;
      padding:13px; font-size:15px; font-weight:700; cursor:pointer; margin-top:4px;
    }
    .login-btn:hover{ background:var(--primary-dark); }
    .login-err{ color:var(--primary); font-size:13px; margin-top:8px; display:none; }
    .login-ok{ color:#059669; font-size:13px; margin-top:8px; display:none; }
    .login-logo{ display:flex; align-items:center; gap:12px; margin-bottom:20px; }
    .login-logo-icon{
      width:44px; height:44px; border-radius:12px;
      background:linear-gradient(135deg,#0ea5e9,#0284c7);
      display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px;
    }
    .login-logo h1{ margin:0; font-size:20px; }
    /* Tabs */
    .auth-tabs{ display:flex; border-bottom:2px solid #e2e8f0; margin-bottom:24px; }
    .auth-tab{
      flex:1; text-align:center; padding:10px; font-size:14px; font-weight:600;
      color:#94a3b8; cursor:pointer; border-bottom:2px solid transparent;
      margin-bottom:-2px; transition:.2s;
    }
    .auth-tab.active{ color:var(--primary); border-bottom-color:var(--primary); }
    .auth-panel{ display:none; }
    .auth-panel.active{ display:block; }

    /* ===== Topbar ===== */
    .topbar{
      display:flex; justify-content:space-between; align-items:center;
      gap:16px; margin-bottom:20px;
    }
    .brand{ display:flex; align-items:center; gap:14px; }
    .brand-icon{
      width:48px; height:48px; border-radius:14px;
      background:linear-gradient(135deg,#0ea5e9,#0284c7);
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:24px; box-shadow:var(--shadow);
    }
    .brand h1{ margin:0; font-size:24px; }
    .brand p{ margin:4px 0 0; font-size:13px; color:var(--muted); }
    .top-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .pill{
      display:inline-flex; align-items:center; gap:6px;
      padding:8px 12px; border-radius:999px; background:#fff;
      border:1px solid var(--border); font-size:13px; color:var(--muted);
    }

    /* ===== KPI ===== */
    .kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px; }
    .kpi{ background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; box-shadow:var(--shadow); }
    .kpi-label{ font-size:13px; color:var(--muted); margin-bottom:8px; }
    .kpi-value{ font-size:28px; font-weight:700; }
    .kpi-note{ font-size:12px; color:var(--muted); margin-top:8px; }

    /* ===== Main layout ===== */
    .main-grid{ display:grid; grid-template-columns:380px 1fr; gap:20px; }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; box-shadow:var(--shadow); }
    .card-title{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; }
    .card-title h2{ margin:0; font-size:16px; }
    .subtext{ font-size:12px; color:var(--muted); }

    /* ===== Form ===== */
    .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .form-grid > div{ min-width:0; }
    .form-grid .full{ grid-column:1 / -1; }
    label{ display:block; font-size:13px; margin-bottom:6px; color:#334155; font-weight:600; }
    input, select, textarea{
      width:100%; max-width:100%; border:1px solid var(--border); border-radius:12px;
      padding:11px 12px; font-size:14px; background:#fff; outline:none; transition:.2s; box-sizing:border-box;
    }
    input:focus, select:focus, textarea:focus{
      border-color:#7dd3fc; box-shadow:0 0 0 4px rgba(2,132,199,.15);
    }
    textarea{ resize:vertical; min-height:88px; max-width:100%; }
    button{ border:none; border-radius:12px; padding:11px 16px; cursor:pointer; font-size:14px; font-weight:600; transition:.2s; }
    .btn{ background:var(--primary); color:#fff; }
    .btn:hover{ background:var(--primary-dark); }
    .btn-outline{ background:#fff; color:var(--text); border:1px solid var(--border); }
    .btn-soft{ background:var(--primary-soft); color:var(--primary-dark); border:none; }
    .action-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }

    /* ===== Filters ===== */
    .filters{ display:grid; grid-template-columns:1.3fr .8fr .8fr; gap:12px; margin-bottom:16px; }

    /* ===== Case List ===== */
    .case-list{ display:flex; flex-direction:column; gap:20px; }
    .case-item{
      border:1px solid var(--border); border-radius:18px; background:#fff; overflow:hidden;
      box-shadow:0 6px 16px rgba(0,0,0,0.05); transition:all .2s ease; border-left:5px solid #e5e7eb;
    }
    .case-item:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,0.08); }
    .case-head{ padding:16px 18px; cursor:pointer; background:#ffffff; border-bottom:1px solid var(--border); }
    .case-head.active{ background:var(--primary-soft); }
    .case-head-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px; }
    .case-id-wrap{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .case-id{ font-size:16px; font-weight:700; }
    .status-badge{ padding:6px 10px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap; }
    .status-pending{ background:var(--pending-bg); color:var(--pending-text); border:1px solid var(--pending-border); }
    .status-progress{ background:var(--progress-bg); color:var(--progress-text); border:1px solid var(--progress-border); }
    .status-done{ background:var(--done-bg); color:var(--done-text); border:1px solid var(--done-border); }
    .status-closed{ background:var(--closed-bg); color:var(--closed-text); border:1px solid var(--closed-border); }
    .case-summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .summary-box{ background:#f9fafb; border:1px solid #f1f5f9; border-radius:14px; padding:10px 12px; }
    .summary-box .label{ font-size:12px; color:var(--muted); margin-bottom:4px; }
    .summary-box .value{ font-size:14px; font-weight:600; }
    .case-body{
      display:none; border-top:1px solid var(--border); background:#f1f5f9;
      padding:18px; border-left:4px solid var(--primary); margin:0 12px 12px; border-radius:12px;
    }
    .panel{ border:1px solid var(--border); border-radius:16px; background:#ffffff; padding:14px; }
    .panel-title{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .panel-title h3{ margin:0; font-size:15px; }
    .role-badge{ padding:5px 10px; border-radius:999px; font-size:12px; font-weight:700; }
    .role-ems{ background:#eff6ff; color:var(--ems); }
    .role-hospital{ background:#ecfdf5; color:var(--hospital); }
    .info-list{ display:grid; gap:10px; }
    .info-item{ background:#f8fafc; border:1px solid var(--border); border-radius:12px; padding:10px 12px; }
    .info-item .label{ font-size:12px; color:var(--muted); margin-bottom:4px; }
    .info-item .value{ font-size:14px; font-weight:600; line-height:1.5; }
    .timeline{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .step{ padding:7px 10px; border-radius:999px; font-size:12px; border:1px solid var(--border); background:#fff; color:var(--muted); }
    .step.active{ background:var(--primary-soft); color:var(--primary-dark); border-color:#ba86fc; border:1px solid var(--primary); font-weight:700; }
    .small{ font-size:12px; color:var(--muted); }
    .empty{ text-align:center; color:var(--muted); padding:32px 12px; }
    .ems-note{ max-height:80px; overflow:auto; line-height:1.5; }
    .case-body-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }

    /* ===== Loading spinner ===== */
    .loading-wrap{ text-align:center; padding:40px; color:var(--muted); }
    .spinner{
      width:32px; height:32px; border:3px solid #e2e8f0;
      border-top-color:var(--primary); border-radius:50%;
      animation:spin .7s linear infinite; margin:0 auto 12px;
    }
    @keyframes spin{ to{ transform:rotate(360deg); } }

    @media (max-width:1200px){ .case-summary{ grid-template-columns:repeat(2,1fr); } .case-body-grid{ grid-template-columns:1fr; } }
    @media (max-width:980px){ .main-grid{ grid-template-columns:1fr; } .kpi-grid{ grid-template-columns:repeat(2,1fr); } }
    @media (max-width:640px){
      .container{ padding:14px; } .topbar{ flex-direction:column; align-items:flex-start; }
      .form-grid, .filters, .case-summary, .kpi-grid{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<!-- ===== Login Overlay ===== -->
<div id="loginOverlay">
  <div class="login-card">
    <div class="login-logo" style="flex-direction:column; align-items:flex-start; gap:8px; margin-bottom:28px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="login-logo-icon" style="width:36px; height:36px; font-size:18px; border-radius:10px;">🚑</div>
        <span style="font-size:18px; font-weight:800; color:var(--primary);">EMS Bridge</span>
      </div>
      <h1 style="margin:0; font-size:28px; color:#0f172a; font-weight:800; letter-spacing:1px;">個案資訊銜接平台</h1>
    </div>
    <!-- Tabs -->
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">登入</div>
      <div class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">註冊帳號</div>
    </div>

    <!-- Login Panel -->
    <div class="auth-panel active" id="panel-login">
      <label>電子郵件</label>
      <input id="loginEmail" type="email" placeholder="請輸入 Email" autocomplete="username" />
      <div id="autoHealMsg" style="display:none; background:#f1f5f9; color:#475569; border-left:3px solid #64748b; padding:10px 14px; font-size:13px; font-weight:600; border-radius:4px; margin-bottom:15px; animation:fadeIn .3s ease;"></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px;">
        <label style="margin-bottom:0;">密碼</label>
        <a href="#" onclick="doForgotPassword();return false;" tabindex="-1" style="font-size:12px;color:var(--primary);text-decoration:none;">忘記密碼？</a>
      </div>
      <input id="loginPassword" type="password" placeholder="請輸入密碼" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') doLogin()" />
      <button class="login-btn" onclick="doLogin()">登入</button>
      <div class="login-err" id="loginErr"></div>
    </div>

    <!-- Register Panel -->
    <div class="auth-panel" id="panel-register">
      <label>電子郵件</label>
      <input id="regEmail" type="email" placeholder="請輸入您的 Email" />
      <label>姓名</label>
      <input id="regName" type="text" placeholder="例如：王小明" />
      <label>所屬單位</label>
      <select id="regUnit" style="width:100%;margin-bottom:15px;padding:12px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:1rem;color:#1e293b;-webkit-appearance:none;appearance:none;cursor:pointer;">
        <option value="" disabled selected hidden>請選擇</option>
        <option value="EMS">EMS</option>
        <option value="醫院端">醫院端</option>
        <option value="衛生所端">衛生所端</option>
        <option value="其他">其他</option>
      </select>
      <label>密碼（至少 6 位數）</label>
      <input id="regPassword" type="password" placeholder="請設定密碼" />
      <label>確認密碼</label>
      <input id="regPassword2" type="password" placeholder="再次輸入密碼"
             onkeydown="if(event.key==='Enter') doRegister()" />
      <button class="login-btn" onclick="doRegister()">建立帳號</button>
      <div class="login-err" id="registerErr"></div>
      <div class="login-ok" id="registerOk"></div>
    </div>
  </div>
</div>

<div class="container" id="appContent" style="display:none;">
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">🚑</div>
      <div>
        <h1>EMS Bridge</h1>
        <p>EMS－醫院端個案資訊銜接平台</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="pill" id="authStatus">未登入</span>
      <button class="btn-outline" onclick="doLogout()">登出</button>
      <button class="btn-outline" id="btnAdmin" style="display:none;" onclick="goAdmin()">後臺管理系統</button>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-label">案件總數</div>
      <div class="kpi-value" id="kpiAll">0</div>
      <div class="kpi-note">目前系統中的全部案件數</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">待醫院回報</div>
      <div class="kpi-value" id="kpiPending">0</div>
      <div class="kpi-note">尚未完成院端治療概況回報</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">處理中案件</div>
      <div class="kpi-value" id="kpiProgress">0</div>
      <div class="kpi-note">醫院已接手但尚未出院或結案</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">已結案</div>
      <div class="kpi-value" id="kpiClosed">0</div>
      <div class="kpi-note">流程已完成並正式結案</div>
    </div>
  </div>

  <div class="main-grid">
    <!-- 建立案件 -->
    <div class="card">
      <div class="card-title">
        <div>
          <h2>EMS 建立案件</h2>
          <div class="subtext">輸入到院前通報資料，供醫院後續接力</div>
        </div>
      </div>
      <div class="form-grid">
        <div><label>病人姓名</label><input id="name" placeholder="例如：王小明"></div>
        <div><label>出生年月日</label><input id="birth" type="date"></div>
        <div>
          <label>性別</label>
          <select id="gender">
            <option value="">請選擇</option>
            <option value="M">男</option>
            <option value="F">女</option>
          </select>
        </div>
        <div><label>身分證字號</label><input id="pid" placeholder="例如：A123456789"></div>
        <div class="full">
          <label>地址 / 居住地</label>
          <input id="addr" placeholder="例如：新北市板橋區文化路一段XXX號">
        </div>
        <div class="full">
          <label>里別判定</label>
          <div style="display:flex; gap:8px; align-items: flex-end;">
            <button class="btn" style="width:auto; padding:0 20px; height:42px; white-space:nowrap;" id="btnLocate" onclick="autoFillVillage()">📍 定位里別</button>
            <div style="flex:1;">
              <input id="village" placeholder="由系統判定 (失敗時可手動輸入)" readonly style="background:#f1f5f9; margin-bottom:0;">
            </div>
          </div>
        </div>
        <div class="full">
          <label>通報時間</label>
          <div style="display:flex; gap:8px;">
            <input id="time" type="datetime-local" style="flex:1; margin-bottom:0;">
            <button class="btn-soft" style="width:auto; padding:0 20px; height:42px; white-space:nowrap;" onclick="setNowTime()">現在</button>
          </div>
        </div>
        <div class="full">
          <label>後送醫院</label>
          <select id="hospital" onchange="toggleOtherHospital()">
            <option value="">請選擇</option>
            <option value="H01">H01-萬芳醫院</option>
            <option value="H02">H02-基隆長庚</option>
            <option value="H03">H03-礦工醫院</option>
            <option value="H04">H04-汐止國泰醫院</option>
            <option value="H05">H05-部立基隆醫院</option>
            <option value="H06">H06-內湖三總醫院</option>
            <option value="H07">H07-瑞芳醫院</option>
            <option value="H08">H08-台北臺大醫院</option>
            <option value="HA1">HA1-其他</option>
          </select>
          <input id="hospitalOther" placeholder="請輸入醫院名稱" style="margin-top:8px; display:none;">
        </div>
        <div class="full"><label>主訴 / 現場狀況</label><input id="cc" placeholder="例如：胸痛、呼吸困難、跌倒外傷"></div>
        <div class="full">
          <label>EMS 現場補充</label>
          <textarea id="emsNote" placeholder="例如：現場生命徵象、搬運情形、處置、家屬聯絡資訊"></textarea>
        </div>
      </div>
      <div class="action-row">
        <button class="btn" id="createBtn" onclick="createCase()">建立案件</button>
      </div>
    </div>

    <!-- 案件清單 -->
    <div class="card">
      <div class="card-title">
        <div>
          <h2>案件清單</h2>
          <div class="subtext">依個案狀態追蹤 EMS → 醫院 之接續流程（即時同步）</div>
        </div>
      </div>
      <div class="filters">
        <input id="searchInput" placeholder="搜尋案件編號 / 姓名 / 主訴 / 地址" oninput="render()">
        <select id="statusFilter" onchange="render()">
          <option value="">全部狀態</option>
          <option value="hospital">待醫院回報</option>
          <option value="gov">待衛生所回報</option>
          <option value="closed">結案</option>
        </select>
      </div>
      <div id="list" class="case-list">
        <div class="loading-wrap"><div class="spinner"></div>正在載入案件資料…</div>
      </div>
    </div>
  </div>
</div>

<!-- Registration Success Modal -->
<div id="regSuccessModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:20px;padding:40px 36px;width:380px;max-width:92vw;box-shadow:0 24px 64px rgba(0,0,0,.3);text-align:center;animation:fadeInUp .35s ease;">
    <div style="font-size:3rem;margin-bottom:12px;">✅</div>
    <h2 style="margin:0 0 8px;font-size:1.3rem;color:#1e293b;">帳號註冊成功！</h2>
    <p style="color:#64748b;font-size:.9rem;margin:0 0 28px;line-height:1.6;" id="regSuccessMsg">您的帳號已建立完成。</p>
    <button id="autoLoginBtn" onclick="doAutoLogin()" style="width:100%;padding:14px;background:#dc2626;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:background .2s;"
      onmouseover="this.style.background='#b91c1c'" onmouseout="this.style.background='#dc2626'">
      立即登入 →
    </button>
    <button onclick="closeRegSuccessModal()" style="margin-top:10px;width:100%;padding:11px;background:transparent;border:1px solid #e2e8f0;border-radius:10px;font-size:.9rem;color:#64748b;cursor:pointer;">稍後再登入</button>
  </div>
</div>

<!-- Reset Password Modal -->
<div id="resetPwdModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:24px;padding:36px;width:380px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:fadeInUp .35s ease;">
    <h2 style="margin:0 0 10px;font-size:22px;color:#1e293b;">重新設定密碼</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:24px;">請設定您的新密碼（至少 6 位數）</p>
    <label style="display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px;">新密碼</label>
    <input id="newPwd1" type="password" placeholder="輸入新密碼" style="width:100%;margin-bottom:12px;padding:12px;border:1px solid #e2e8f0;border-radius:12px;outline:none;" />
    <label style="display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px;">確認新密碼</label>
    <input id="newPwd2" type="password" placeholder="再次輸入新密碼" style="width:100%;margin-bottom:24px;padding:12px;border:1px solid #e2e8f0;border-radius:12px;outline:none;" />
    <button id="btnResetConfirm" onclick="doResetPassword()" style="width:100%;background:var(--primary);color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;">確認重設</button>
  </div>
</div>

<!-- Supabase SDK -->
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  // ===== Supabase Config =====
  const SUPABASE_URL = 'https://pqrvqwobvqjhbnvjksbb.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_KCjTHB1Wgm8P0t2TyzDsmw_3dZncrBf';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  // ===== State =====
  let allTasks = [];
  let currentUser = null;
  let realtimeChannel = null;

  // ===== Auto-Heal Seamless Re-Login =====
  setTimeout(() => {
    const healEmail = window.sessionStorage.getItem('auto_heal_email');
    const healPwd = window.sessionStorage.getItem('auto_heal_pwd');
    if (healEmail && healPwd) {
      window.sessionStorage.removeItem('auto_heal_email');
      window.sessionStorage.removeItem('auto_heal_pwd');
      document.getElementById('loginEmail').value = healEmail;
      document.getElementById('loginPassword').value = healPwd;
      console.log('🔄 Auto-heal triggered. Attempting seamless login...');
      if (typeof doLogin === 'function') doLogin();
    }
  }, 500);

  // ===== Auth =====
  window.doLogin = async function() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginErr');
    const btn = document.querySelector('.login-btn');
    errEl.style.display = 'none';
    if (!email || !password) { showLoginErr('請輸入帳號與密碼'); return; }

    const originalText = btn.textContent;
    btn.textContent = '登入中...';
    btn.disabled = true;

    try {
      const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('登入請求逾時卡死')), 3500));
      const authPromise = supabase.auth.signInWithPassword({ email, password });
      
      const { error } = await Promise.race([authPromise, timeoutPromise]);
      if (error) {
        showLoginErr(error.message.includes('Invalid') ? '帳號或密碼錯誤' : '登入失敗：' + error.message);
        btn.textContent = originalText;
        btn.disabled = false;
      }
    } catch (err) {
      console.warn("發生無限迴圈死鎖，系統強制清除病灶:", err);
      
      const inlineMsg = document.getElementById('autoHealMsg');
      if (inlineMsg) {
        inlineMsg.textContent = '上次未完成系統登出，需要稍候才能協助登入...';
        inlineMsg.style.display = 'block';
      }

      window.localStorage.clear();
      // 暫存帳號密碼，供重新載入後自動登入使用
      window.sessionStorage.setItem('auto_heal_email', email);
      window.sessionStorage.setItem('auto_heal_pwd', password);
      setTimeout(() => window.location.reload(), 2000);
    }
  };

  window.doLogout = async function() {
    if (realtimeChannel) { try { supabase.removeChannel(realtimeChannel); } catch(e){} }
    try {
      await Promise.race([
        supabase.auth.signOut(),
        new Promise(r => setTimeout(r, 2000))
      ]);
    } catch(err) {
      console.warn("Logout error:", err);
    }
    window.localStorage.clear();
    window.sessionStorage.clear();
    window.location.reload();
  };

  window.goAdmin = function() {
    window.location.href = 'admin.html';
  };

  window.setNowTime = function() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const localStr = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    document.getElementById('time').value = localStr;
  };

  // ===== Register =====
  window.doRegister = async function() {
    const email = document.getElementById('regEmail').value.trim();
    const name = document.getElementById('regName').value.trim();
    const regUnit = document.getElementById('regUnit').value;
    const pw = document.getElementById('regPassword').value;
    const pw2 = document.getElementById('regPassword2').value;
    const errEl = document.getElementById('registerErr');
    const okEl = document.getElementById('registerOk');
    errEl.style.display = 'none'; okEl.style.display = 'none';

    if (!email) { showRegErr('請輸入電子郵件'); return; }
    if (!name) { showRegErr('請輸入姓名'); return; }
    if (!regUnit) { showRegErr('請選擇所屬單位'); return; }
    if (pw.length < 6) { showRegErr('密碼至少需要 6 位數'); return; }
    if (pw !== pw2) { showRegErr('兩次密碼不一致，請重新輸入'); return; }

    const { error } = await supabase.auth.signUp({
      email, password: pw,
      options: { data: { display_name: name || email, unit: regUnit } }
    });
    if (error) {
      const msg = error.message.includes('already') ? '此 Email 已被註冊，請直接登入' : '註冊失敗：' + error.message;
      showRegErr(msg);
    } else {
      // 暫存登入資訊，顯示成功彈窗
      _isRegistering = true;
      _pendingEmail = email; _pendingPw = pw;
      document.getElementById('regSuccessMsg').textContent =
        `您的帳號「${name || email}」已建立完成！`;
      document.getElementById('regSuccessModal').style.display = 'flex';
    }
  };

  let _pendingEmail = ''; let _pendingPw = ''; let _isRegistering = false;

  window.doAutoLogin = async function() {
    const btn = document.getElementById('autoLoginBtn');
    btn.textContent = '登入中…'; btn.disabled = true;
    _isRegistering = false;
    try {
      const { error } = await supabase.auth.signInWithPassword({
        email: _pendingEmail, password: _pendingPw
      });
      if (error) {
        btn.textContent = '登入失敗，請手動登入'; btn.disabled = false;
      } else {
        closeRegSuccessModal();
      }
    } catch (err) {
      console.error(err);
      window.location.reload();
    }
  };

  window.closeRegSuccessModal = function() {
    _isRegistering = false;
    document.getElementById('regSuccessModal').style.display = 'none';
    _pendingEmail = ''; _pendingPw = '';
    switchAuthTab('login');
  };

  // ===== Forgot Password =====
  window.doForgotPassword = async function() {
    const email = document.getElementById('loginEmail').value.trim();
    if (!email) {
      showLoginErr('請先在上方的「電子郵件」欄位輸入您的 Email，再點擊忘記密碼。');
      return;
    }
    if (!confirm(`系統將寄送「重設密碼信」至：\n${email}\n是否確定寄送？`)) return;

    const btn = document.querySelector('.login-btn');
    const ogText = btn.textContent;
    btn.textContent = '信件寄送中...'; btn.disabled = true;

    try {
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname,
      });
      if (error) {
        showLoginErr('寄送信件失敗，請稍後再試。');
      } else {
        const errEl = document.getElementById('loginErr');
        errEl.textContent = '✅ 重設信件已寄出！請前往信箱收取。'; 
        errEl.style.color = '#059669'; errEl.style.display = 'block';
        setTimeout(() => { errEl.style.color = 'var(--primary)'; errEl.style.display = 'none'; }, 8000);
      }
    } catch(err) {
      console.error(err);
      showLoginErr('發生錯誤，請重試。');
    } finally {
      btn.textContent = ogText; btn.disabled = false;
    }
  };

  window.doResetPassword = async function() {
    const pw1 = document.getElementById('newPwd1').value;
    const pw2 = document.getElementById('newPwd2').value;
    if (!pw1 || pw1.length < 6) { alert('密碼至少需要 6 位數'); return; }
    if (pw1 !== pw2) { alert('兩次密碼不一致'); return; }
    
    const btn = document.getElementById('btnResetConfirm');
    btn.textContent = '密碼更新中...'; btn.disabled = true;

    const { error } = await supabase.auth.updateUser({ password: pw1 });
    if (error) {
      alert('密碼重設失敗，重設連結可能已失效，請重新申請。');
      window.localStorage.clear(); window.sessionStorage.clear();
      window.location.reload();
    } else {
      alert('✅ 密碼更新成功！請使用新密碼重新登入。');
      await supabase.auth.signOut();
      window.localStorage.clear(); window.sessionStorage.clear();
      window.location.reload();
    }
  };


  window.switchAuthTab = function(tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('panel-login').classList.toggle('active', tab === 'login');
    document.getElementById('panel-register').classList.toggle('active', tab === 'register');
    document.getElementById('loginErr').style.display = 'none';
    document.getElementById('registerErr').style.display = 'none';
    document.getElementById('registerOk').style.display = 'none';
  };

  function showLoginErr(msg) {
    const el = document.getElementById('loginErr');
    el.textContent = msg; el.style.display = 'block';
  }
  function showRegErr(msg) {
    const el = document.getElementById('registerErr');
    el.textContent = msg; el.style.display = 'block';
  }

  // ===== Auth State Listener =====
  supabase.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      _isRegistering = true; // 阻擋一般渲染邏輯
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('resetPwdModal').style.display = 'flex';
      return;
    }

    if (_isRegistering) return;
    currentUser = session?.user ?? null;

    if (currentUser) {
      // 🚀 [修正] 快速隱入：只要有 User，先隱藏登入框，讓使用者不會覺得被踢出去
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('appContent').style.display = 'block';
      document.getElementById('authStatus').textContent = '⌛ 驗證中...';
      
      // 延遲 500ms 等待 Supabase session token 完全就緒再查詢，避免 race condition
      if (!realtimeChannel) setTimeout(() => subscribeToTasks(), 500);

      try {
        // 直接用 fetch + localStorage token，避免 Supabase client 卡住
        const token = getStoredToken();
        if (!token) throw new Error('no token');
        const res = await Promise.race([
          fetch(`${SUPABASE_URL}/rest/v1/profiles?select=id,is_active,display_name,role&id=eq.${currentUser.id}`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
          }),
          new Promise((_, reject) => setTimeout(() => reject(new Error('profile timeout')), 5000))
        ]);
        const arr = await res.json();
        const profile = Array.isArray(arr) ? arr[0] : null;

        if (profile && !profile.is_active) {
          document.getElementById('loginOverlay').style.display = 'flex';
          document.getElementById('appContent').style.display = 'none';
          if (realtimeChannel) { try { supabase.removeChannel(realtimeChannel); } catch(e){} realtimeChannel = null; }
          showLoginErr('此帳號已被停用，請聯絡管理員');
          return;
        }

        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        const displayName = profile?.display_name || currentUser.email;
        document.getElementById('authStatus').textContent = '✓ ' + displayName;

        document.getElementById('btnAdmin').style.display = 'inline-block';
      } catch (err) {
        console.warn("驗證身分時發生錯誤:", err);
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        document.getElementById('authStatus').textContent = '✓ ' + (currentUser.email || '已登入');
        document.getElementById('btnAdmin').style.display = 'inline-block';
      }
    } else {
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('appContent').style.display = 'none';
      if (realtimeChannel) { supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
      allTasks = [];
    }
  });

  // ===== Supabase Realtime listener =====

  function getStoredToken() {
    try {
      for (const k of Object.keys(localStorage)) {
        if (k.startsWith('sb-') && k.endsWith('-auth-token')) {
          const parsed = JSON.parse(localStorage.getItem(k));
          const t = parsed?.access_token || parsed?.currentSession?.access_token || parsed?.session?.access_token;
          if (t) return t;
        }
      }
    } catch(e) { console.warn('getStoredToken error:', e); }
    return null;
  }

  async function fetchCases(token) {
    const res = await Promise.race([
      fetch(`${SUPABASE_URL}/rest/v1/cases?select=*&order=created_at.desc`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
      }),
      new Promise((_, reject) => setTimeout(() => reject(new Error('載入逾時，請重新整理頁面')), 8000))
    ]);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error(data?.message || '資料格式錯誤');
    return data;
  }

  async function subscribeToTasks() {
    // 直接從 localStorage 讀 token，完全繞開可能卡住的 Supabase client
    const token = getStoredToken();
    if (!token) {
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('appContent').style.display = 'none';
      realtimeChannel = null;
      return;
    }

    const listEl = document.getElementById('list');
    try {
      const data = await fetchCases(token);
      allTasks = data.map(mapRow);
      render();
    } catch (e) {
      listEl.innerHTML = `<div class="empty">⚠️ ${e.message}</div>`;
      realtimeChannel = null;
      return;
    }

    realtimeChannel = supabase
      .channel('cases-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'cases' }, async () => {
        const t = getStoredToken();
        if (!t) return;
        try {
          const fresh = await fetchCases(t);
          allTasks = fresh.map(mapRow);
          render();
        } catch(e) {}
      })
      .subscribe();
  }

  function mapRow(r) {
    return {
      dbId: r.id,
      id: r.case_id,
      name: r.name,
      birth: r.birth,
      gender: r.gender,
      pid: r.pid,
      addr: r.addr,
      village: r.village,
      time: r.transport_time,
      transportHospitalCode: r.transport_hospital_code,
      transportHospital: r.transport_hospital,
      cc: r.cc,
      emsNote: r.ems_note,
      hospital: {
        diagnosis: r.hosp_diagnosis,
        treatment: r.hosp_treatment,
        disposition: r.hosp_disposition,
        reporter: r.hosp_reporter,
        updatedAt: r.hosp_updated_at
      },
      report: { status: r.report_status, note: r.report_note },
      createdByEmail: r.created_by_email
    };
  }

  // ===== Create Case =====
  window.createCase = async function() {
    if (!currentUser) { alert('請先登入'); return; }
    const name = document.getElementById('name').value.trim();
    const birth = document.getElementById('birth').value.trim();
    const gender = document.getElementById('gender').value;
    const pid = document.getElementById('pid').value.trim();
    const hospitalCode = document.getElementById('hospital').value;
    const hospitalOther = document.getElementById('hospitalOther').value.trim();
    const addr = document.getElementById('addr').value.trim();
    const time = document.getElementById('time').value.trim();
    const cc = document.getElementById('cc').value.trim();
    const emsNote = document.getElementById('emsNote').value.trim();

    if (birth) {
      const age = calcAge(birth);
      if (age < 0 || age > 120) { alert('⚠️ 出生年月日異常'); return; }
    }

    const btn = document.getElementById('createBtn');
    btn.disabled = true; btn.textContent = '建立中…';

    // 生成案號 (EMS-日期-流水號)
    let finalCaseId = '';
    const dateStr = time ? time.slice(0, 10).replace(/-/g, '') : getNowText().slice(0, 10).replace(/-/g, '');
    const prefix = `EMS-${dateStr}-`;
    
    // 查詢當日最高號碼
    const { data: latest } = await supabase
      .from('cases')
      .select('case_id')
      .ilike('case_id', `${prefix}%`)
      .order('case_id', { ascending: false })
      .limit(1);
    
    if (latest && latest.length > 0) {
      const lastId = latest[0].case_id;
      const lastSeq = parseInt(lastId.slice(-2));
      finalCaseId = prefix + String(lastSeq + 1).padStart(2, '0');
    } else {
      finalCaseId = prefix + '01';
    }

    const { error } = await supabase.from('cases').insert({
      case_id: finalCaseId,
      name: name || '未填姓名',
      birth: birth || null,
      gender: gender || '',
      pid: pid || '',
      transport_hospital_code: hospitalCode || '',
      transport_hospital: hospitalCode === 'HA1' ? hospitalOther : hospitalCode,
      addr: addr || '未填地址',
      village: document.getElementById('village').value.trim() || '',
      transport_time: time || '',
      cc: cc || '未填主訴',
      ems_note: emsNote || '',
      report_status: 'hospital',
      report_note: '',
      created_by: currentUser.id,
      created_by_email: currentUser.email
    });

    if (error) {
      alert('建立案件失敗：' + error.message);
    } else {
      ['name','birth','pid','addr','village','time','cc','emsNote'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('gender').value = '';
      document.getElementById('hospital').value = '';
      document.getElementById('hospitalOther').style.display = 'none';
      document.getElementById('village').readOnly = true;
      document.getElementById('village').style.background = '#f1f5f9';
    }
    btn.disabled = false; btn.textContent = '建立案件';
  };

  // ===== Save Hospital Report =====
  window.saveHospital = async function(dbId, caseId) {
    const diagnosis = document.getElementById('diag-' + caseId).value.trim();
    const treatment = document.getElementById('treat-' + caseId).value.trim();
    const disposition = document.getElementById('disp-' + caseId).value;
    const reporter = document.getElementById('reporter-' + caseId).value.trim();
    const newStatus = (diagnosis || treatment || disposition) ? 'gov' : 'hospital';
    const { error } = await supabase.from('cases').update({
      hosp_diagnosis: diagnosis, hosp_treatment: treatment,
      hosp_disposition: disposition, hosp_reporter: reporter,
      hosp_updated_at: getNowText(), report_status: newStatus
    }).eq('id', dbId);
    
    if (error) {
      alert('儲存失敗：' + error.message);
    } else {
      // 立即更新本地狀態，確保 UI 反應順暢
      const t = allTasks.find(x => x.dbId === dbId);
      if (t) {
        t.hospital.diagnosis = diagnosis;
        t.hospital.treatment = treatment;
        t.hospital.disposition = disposition;
        t.hospital.reporter = reporter;
        t.hospital.updatedAt = getNowText();
        t.report.status = newStatus;
      }
      alert('儲存成功！');
      window.render();
    }
  };

  // ===== Save Gov Report =====
  window.saveGov = async function(dbId, caseId) {
    const note = document.getElementById('gov-' + caseId).value.trim();
    const { error } = await supabase.from('cases').update({
      report_note: note, report_status: 'reviewed'
    }).eq('id', dbId);
    
    if (error) {
      alert('儲存失敗：' + error.message);
    } else {
      const t = allTasks.find(x => x.dbId === dbId);
      if (t) {
        t.report.note = note;
        t.report.status = 'reviewed';
      }
      alert('儲存成功！');
      window.render();
    }
  };

  // ===== Unlock Fields =====
  window.unlockHosp = function(caseId, dbId) {
    if (!confirm('確定要重新開啟編輯模式嗎？\n(為求時效，無需重新輸入密碼)')) return;
    ['diag-', 'treat-', 'reporter-'].forEach(prefix => document.getElementById(prefix + caseId).readOnly = false);
    document.getElementById('disp-' + caseId).disabled = false;
    document.getElementById('hospAction-' + caseId).innerHTML = `<div class="action-row"><button class="btn" onclick="saveHospital('${dbId}', '${caseId}')">儲存更新</button></div>`;
  };

  window.unlockGov = function(caseId, dbId) {
    if (!confirm('確定要重新開啟編輯模式嗎？\n(為求時效，無需重新輸入密碼)')) return;
    document.getElementById('gov-' + caseId).readOnly = false;
    document.getElementById('govAction-' + caseId).innerHTML = `<div class="action-row"><button class="btn" onclick="saveGov('${dbId}', '${caseId}')">儲存更新</button></div>`;
  };

  // ===== Toggle Case =====
  window.toggleCase = function(caseId) {
    const el = document.getElementById('body-' + caseId);
    if (!el) return;
    const head = el.previousElementSibling;
    const isOpen = el.style.display === 'block';
    el.style.display = isOpen ? 'none' : 'block';
    if (!isOpen) { head.classList.add('active'); } else { head.classList.remove('active'); }
  };

  // ===== Toggle Other Hospital =====
  window.toggleOtherHospital = function() {
    const val = document.getElementById('hospital').value;
    const other = document.getElementById('hospitalOther');
    other.style.display = val === 'HA1' ? 'block' : 'none';
    if (val !== 'HA1') other.value = '';
  };

  // ===== Render =====
  window.render = function() {
    const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
    const statusFilter = document.getElementById('statusFilter')?.value || '';
    let tasks = [...allTasks].filter(t => {
      // 依使用者需求：結案後，案件平台就看不到這個病患訊息卡片
      if (t.report?.status === 'closed') return false;

      const keywordHit = [t.id, t.name, t.cc, t.addr,
        t.hospital?.diagnosis || '', t.hospital?.reporter || '']
        .join(' ').toLowerCase().includes(q);
      const statusHit = !statusFilter || t.report?.status === statusFilter;
      return keywordHit && statusHit;
    });
    updateKPI();
    const list = document.getElementById('list');
    if (!list) return;
    if (tasks.length === 0) {
      list.innerHTML = `<div class="empty">目前沒有符合條件的案件</div>`;
      return;
    }
    list.innerHTML = tasks.map(t => `
      <div class="case-item">
        <div class="case-head" onclick="toggleCase('${t.id}')">
          <div class="case-head-top">
            <div>
              <div class="case-id-wrap"><div class="case-id">${t.id}</div></div>
              <div class="subtext" style="margin-top:6px;">${formatDateTime(t.time) || '未填時間'}</div>
            </div>
            <span class="status-badge ${statusClass(t.report?.status)}">${getStatusText(t.report?.status)}</span>
          </div>
          <div class="case-summary">
            <div class="summary-box"><div class="label">病人</div><div class="value">${maskName(t.name)}｜${formatGender(t.gender)}｜${calcAge(t.birth) || '-'} 歲</div></div>
            <div class="summary-box"><div class="label">主訴</div><div class="value">${t.cc || '-'}</div></div>
            <div class="summary-box"><div class="label">後送醫院</div><div class="value">${formatHospital(t.transportHospital)}</div></div>
          </div>
        </div>
        <div class="case-body" id="body-${t.id}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div class="timeline">
              <span class="step active">EMS 通報</span>
              <span class="step ${t.report?.status === 'gov' || t.report?.status === 'reviewed' || t.report?.status === 'closed' ? 'active' : ''}">醫院處置</span>
              <span class="step ${t.report?.status === 'gov' || t.report?.status === 'reviewed' || t.report?.status === 'closed' ? 'active' : ''}">衛生所</span>
              <span class="step ${t.report?.status === 'closed' ? 'active' : ''}">結案</span>
            </div>
          </div>
          <div class="case-body-grid">
            <div class="panel" style="grid-column:1 / -1;">
              <div class="panel-title"><h3>院前資訊（EMS）</h3><span class="role-badge role-ems">EMS</span></div>
              <div class="info-list">
                <div class="info-item"><div class="label">基本資訊</div><div class="value">${t.birth || '-'} ｜ ${formatGender(t.gender)} ｜ ${t.pid ? maskPID(t.pid) : '-'}</div></div>
                <div class="info-item"><div class="label">地址 / 里別</div><div class="value">${t.addr || '-'} ${t.village ? '(' + t.village + ')' : ''}</div></div>
                <div class="info-item"><div class="label">EMS 現場補充</div><div class="value ems-note">${t.emsNote || '無'}</div></div>
              </div>
            </div>
            <div class="panel">
              <div class="panel-title"><h3>醫院端回報</h3><span class="role-badge role-hospital">醫院</span></div>
              <label>初步診斷 / 問題摘要</label>
              <input id="diag-${t.id}" value="${escapeHtml(t.hospital?.diagnosis || '')}" placeholder="例如：肺炎、頭部外傷、低血糖" ${t.report?.status !== 'hospital' && t.hospital?.updatedAt ? 'readonly' : ''} />
              <textarea id="treat-${t.id}" placeholder="例如：已完成抽血、影像檢查、藥物治療與後續處置" ${t.report?.status !== 'hospital' && t.hospital?.updatedAt ? 'readonly' : ''}>${escapeHtml(t.hospital?.treatment || '')}</textarea>
              <select id="disp-${t.id}" ${t.report?.status !== 'hospital' && t.hospital?.updatedAt ? 'disabled' : ''}>
                <option value="" ${!t.hospital?.disposition ? 'selected' : ''}>請選擇醫療端動向</option>
                <option value="急診留觀" ${t.hospital?.disposition === '急診留觀' ? 'selected' : ''}>急診留觀</option>
                <option value="辦理住院" ${t.hospital?.disposition === '辦理住院' ? 'selected' : ''}>辦理住院</option>
                <option value="轉至他院" ${t.hospital?.disposition === '轉至他院' ? 'selected' : ''}>轉至他院</option>
                <option value="轉至HAH" ${t.hospital?.disposition === '轉至HAH' ? 'selected' : ''}>轉至HAH</option>
                <option value="出院返家" ${t.hospital?.disposition === '出院返家' ? 'selected' : ''}>出院返家</option>
              </select>
              <input id="reporter-${t.id}" value="${escapeHtml(t.hospital?.reporter || '')}" placeholder="例如：急診醫師、急診護理師" ${t.report?.status !== 'hospital' && t.hospital?.updatedAt ? 'readonly' : ''} />
              <div class="small">最後更新：${t.hospital?.updatedAt || '尚未填寫醫療端回報'}</div>
              <div id="hospAction-${t.id}">
                ${(t.report?.status !== 'hospital' && t.hospital?.updatedAt) ? `
                  <div class="action-row" style="justify-content:flex-start; align-items:center; gap:12px;">
                    <span style="color:#16a34a; font-weight:700; font-size:14px;">✅ 已完成回報</span>
                    <button class="btn-outline" style="padding:6px 12px; font-size:12px;" onclick="unlockHosp('${t.id}', '${t.dbId}')">重新編輯</button>
                  </div>
                ` : `
                  <div class="action-row"><button class="btn" onclick="saveHospital('${t.dbId}', '${t.id}')">儲存醫院回報</button></div>
                `}
              </div>
            </div>
            <div class="panel">
              <div class="panel-title"><h3>衛生所回報</h3><span class="role-badge" style="background:#fef3c7;color:#92400e;">衛生所</span></div>
              <label>衛生所回報內容</label>
              <textarea id="gov-${t.id}" placeholder="例如：已電話追蹤、安排家訪、提供衛教與資源轉介" ${t.report?.status === 'reviewed' || t.report?.status === 'closed' ? 'readonly' : ''}>${escapeHtml(t.report?.note || '')}</textarea>
              <div class="small">狀態：${getStatusText(t.report?.status)}${!t.report?.note ? '｜尚未填寫衛生所回報' : ''}</div>
              <div id="govAction-${t.id}">
                ${(t.report?.status === 'reviewed' || t.report?.status === 'closed') ? `
                  <div class="action-row" style="justify-content:flex-start; align-items:center; gap:12px;">
                    <span style="color:#16a34a; font-weight:700; font-size:14px;">✅ 已完成回報</span>
                    <button class="btn-outline" style="padding:6px 12px; font-size:12px;" onclick="unlockGov('${t.id}', '${t.dbId}')">重新編輯</button>
                  </div>
                ` : `
                  <div class="action-row"><button class="btn" onclick="saveGov('${t.dbId}', '${t.id}')">儲存衛生所回報</button></div>
                `}
              </div>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  };

  function updateKPI() {
    document.getElementById('kpiAll').textContent = allTasks.length;
    document.getElementById('kpiPending').textContent = allTasks.filter(t => t.report?.status === 'hospital').length;
    document.getElementById('kpiProgress').textContent = allTasks.filter(t => t.report?.status === 'gov' || t.report?.status === 'reviewed').length;
    document.getElementById('kpiClosed').textContent = allTasks.filter(t => t.report?.status === 'closed').length;
  }

  // ===== Helpers =====
  function makeId() {
    const d = new Date();
    return `EMS-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(Math.floor(Math.random()*9000)+1000)}`;
  }
  function getNowText() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  function calcAge(birth) {
    if (!birth) return '';
    const today = new Date(); const b = new Date(birth);
    let age = today.getFullYear() - b.getFullYear();
    if (today.getMonth() < b.getMonth() || (today.getMonth() === b.getMonth() && today.getDate() < b.getDate())) age--;
    return age;
  }

  // ===== Auto Village Locate =====
  window.autoFillVillage = async function() {
    const addr = document.getElementById('addr').value.trim();
    if (!addr) { alert('請先輸入地址才能定位'); return; }
    
    // ⚠️ 這裡必填：請將下方 YOUR_GOOGLE_MAPS_API_KEY 替換成你剛剛申請的那串 AIza... 金鑰
    const GOOGLE_API_KEY = 'AIzaSyDIGc_NIVTMzKgoCwWDo6YMwRg3vz8pCPw';

    const btn = document.getElementById('btnLocate');
    const orgText = btn.textContent;
    btn.textContent = '定位中...'; btn.disabled = true;
    const vInput = document.getElementById('village');

    try {
      if (GOOGLE_API_KEY === 'YOUR_GOOGLE_MAPS_API_KEY') {
        throw new Error('開發者尚未填寫 Google Maps API 金鑰於原始碼中');
      }

      // Step 1: 地址 -> 經緯度 (Google Maps)
      const geoUrl = `https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(addr)}&key=${GOOGLE_API_KEY}&language=zh-TW`;
      const res = await fetch(geoUrl);
      const data = await res.json();
      
      if (data.status !== 'OK' || !data.results.length) {
        throw new Error('Google 無法解析此地址的座標');
      }
      const { lat, lng } = data.results[0].geometry.location;

      // Step 2: 經緯度 -> 里別 (國土測繪圖資服務雲 NLSC API，免金鑰政府開放資料)
      const nlscUrl = `https://api.nlsc.gov.tw/other/TownVillagePointQuery/${lng}/${lat}`;
      const resNlsc = await fetch(nlscUrl);
      const xmlText = await resNlsc.text();
      
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const villageNode = xmlDoc.getElementsByTagName("villageName")[0];
      
      if (!villageNode) throw new Error('政府圖資無法從該座標反查到里別');
      
      vInput.value = villageNode.textContent;
      vInput.readOnly = true;
      vInput.style.background = '#f1f5f9';

    } catch (err) {
      alert('定位失敗：' + err.message + '\n\n您現在可以直接手動在欄位中打字輸入里別。');
      vInput.readOnly = false; // 失敗時解鎖，允許手動輸入
      vInput.style.background = '#fff';
    } finally {
      btn.textContent = orgText; btn.disabled = false;
    }
  };

  function maskName(name) {
    if (!name) return '';
    if (name.length === 1) return name + '○';
    return name[0] + '○' + name.slice(-1);
  }
  function maskPID(pid) {
    if (!pid) return '-';
    if (pid.length < 6) return pid;
    return pid[0] + '****' + pid.slice(-4);
  }
  function formatGender(g) {
    if (g === 'M' || g === '男') return '男';
    if (g === 'F' || g === '女') return '女';
    return '-';
  }
  function formatHospital(code) {
    const map = { H01:'萬芳醫院', H02:'基隆長庚', H03:'礦工醫院', H04:'汐止國泰', H05:'部立基隆', H06:'內湖三總', H07:'瑞芳醫院', H08:'台大醫院' };
    return map[code] || code || '-';
  }
  function formatDateTime(v) { return v ? String(v).replace('T',' ') : ''; }
  function getStatusText(st) {
    if (st === 'hospital') return '待醫院回報';
    if (st === 'gov') return '待衛生所回報';
    if (st === 'reviewed') return '待後台結案';
    if (st === 'closed') return '已結案';
    return '-';
  }
  function statusClass(st) {
    if (st === 'hospital') return 'status-pending';
    if (st === 'gov') return 'status-progress';
    if (st === 'reviewed') return 'status-progress';
    if (st === 'closed') return 'status-closed';
    return '';
  }
  function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
